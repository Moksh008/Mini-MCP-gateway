# Serves the console and reverse-proxies gateway paths, so the browser talks to a single origin
# (no CORS, API keys never leave the same-origin context).
upstream gateway {
    server gateway:8787;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(mcp|v1|admin|healthz|readyz|metrics)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;              # Streamable HTTP may answer with SSE
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
