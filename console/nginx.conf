# Serves the console and reverse-proxies gateway paths, so the browser talks to a single origin
# (no CORS, API keys never leave the same-origin context).
upstream gateway {
    server gateway:8787;
    keepalive 32;
}

# Real client IP: trust X-Forwarded-For only from private-network proxies (Caddy in production),
# then forward a single, overwritten X-Forwarded-For so the gateway's per-IP limits can't be
# spoofed by clients.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# First line of defence, per client IP. The gateway enforces finer per-principal/per-tool limits.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=agent:10m rate=6r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JSON body for proxy-level throttling, so the console and API clients can show it properly.
    error_page 429 = @throttled;
    location @throttled {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"error":"rate_limited","message":"Too many requests from your network. Please wait a few seconds."}';
    }

    # LLM agent runs cost money: strict per-IP limit, long-lived streamed responses.
    location = /v1/agent/run {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        limit_req zone=agent burst=3 nodelay;
        proxy_read_timeout 180s;
    }

    location ~ ^/(mcp|v1|admin|healthz|readyz|metrics)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        limit_req zone=api burst=40 nodelay;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
