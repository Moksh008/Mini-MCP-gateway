name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m mcp_gateway check-config -c examples/gateway.yaml
      - run: pytest -q

  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: console/package-lock.json }
      - run: npm ci
      - run: npm run build   # includes tsc --noEmit

  stack-e2e:
    # Full single-machine stack in Docker, driven through the real UI in a headless browser.
    runs-on: ubuntu-latest
    needs: [test, console]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python console/e2e/ui_smoke.py --url http://localhost:3000 --shots screenshots
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: screenshots }
      - if: failure()
        run: docker compose logs
